name: Cloud market data

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Price-only or full financial refresh
        default: full
        type: choice
        options: [quick, full]
  schedule:
    # UTC. Daily after US close, plus two intraday price snapshots.
    - cron: "23 22 * * 1-5"
    - cron: "23 15,18 * * 1-5"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: cloud-market-data
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install market data dependencies
        run: python -m pip install -r requirements.txt
      - name: Restore market cache only
        uses: actions/cache@v6
        with:
          path: .cache/quant_engine.sqlite3
          key: cloud-market-v1-${{ github.run_id }}
          restore-keys: cloud-market-v1-
      - name: Collect and export public research snapshots
        env:
          REQUESTED_MODE: ${{ inputs.mode }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: |
          mode=quick
          if [ "$REQUESTED_MODE" = full ] || [ "$EVENT_SCHEDULE" = '23 22 * * 1-5' ] || [ ! -f .cache/quant_engine.sqlite3 ]; then mode=full; fi
          python scripts/export_cloud.py --output output/cloud-publish/data --refresh "$mode" --history-limit 40 --portfolio-refresh
      - name: Check usable snapshot before publication
        run: |
          python -c "import json; p=json.load(open('output/cloud-publish/data/dashboard.json')); assert p.get('eligible_count',0)>0, 'No scored company: keep previous publication'; print('Eligible companies:',p['eligible_count'])"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: output/cloud-publish
  publish:
    needs: collect
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish public data only
        id: deployment
        uses: actions/deploy-pages@v5
